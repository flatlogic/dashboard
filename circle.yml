machine:
  node:
    version: 22.23.0

dependencies:
  cache_directories:
      - node_modules
      - bower_components
  override:
    - npm install
    - npm install -g bower
    - bower install

test:
  override:
    - ./node_modules/.bin/gulp build
    - ./node_modules/.bin/karma start --single-run

deployment:
  production:
    branch: master
    commands:
      - git config --global user.name "Circle CI"
      - git config --global user.email "sdgaykov@gmail.com"
      - cd dist && echo "dashboard.qoriolabs.com" > CNAME
      - cd dist && git init
      - cd dist && git add .
      - cd dist && git commit -m "Deploy to GitHub Pages [ci skip]"
      - cd dist && git push --force --quiet "https://${GH_TOKEN}@github.com/qoriolabs/dashboard.git" master:gh-pages
